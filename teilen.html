<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Auf Facebook posten</title>
<style>
  :root { --blau: #1877f2; --text: #1c1e21; --grau: #65676b; --hg: #f0f2f5; --karte: #fff; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #e4e6eb; --grau: #b0b3b8; --hg: #18191a; --karte: #242526; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--hg); color: var(--text); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p { color: var(--grau); line-height: 1.45; margin: 0 0 20px; }
  button { width: 100%; padding: 20px 16px; font-size: 1.2rem; font-weight: 700; color: #fff;
           background: var(--blau); border: 0; border-radius: 14px; cursor: pointer; }
  button:active { transform: scale(.98); }
  #status { min-height: 1.5em; margin: 14px 0 0; font-weight: 600; color: var(--text); }
  pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; line-height: 1.45;
        background: var(--karte); border-radius: 14px; padding: 16px; margin: 20px 0 0; }
</style>
</head>
<body>
<main>
  <h1>📘 Auf Facebook posten</h1>
  <p>Ein Tipp auf den Knopf kopiert den ganzen Text und öffnet Facebook. Dort oben auf
     <b>„Was machst du gerade?“</b> tippen → <b>Einfügen</b> → <b>Posten</b>.</p>
  <button id="los" disabled>📋 Kopieren &amp; Facebook öffnen</button>
  <div id="status"></div>
  <pre id="text">Text wird geladen …</pre>
</main>
<script>
  // Der Text steht hinter dem "#" in der Adresse – er wird nie an einen Server geschickt.
  const knopf = document.getElementById("los");
  const status = document.getElementById("status");
  const vorschau = document.getElementById("text");
  let text = "";

  async function lesen() {
    const h = new URLSearchParams(location.hash.slice(1));
    text = h.get("t") || "";
    const z = h.get("z");
    if (z) {
      const b64 = z.replace(/-/g, "+").replace(/_/g, "/");
      const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const strom = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      text = await new Response(strom).text();
    }
  }

  async function kopieren(t) {
    try {
      await navigator.clipboard.writeText(t);
      return true;
    } catch (e) {
      const feld = document.createElement("textarea");
      feld.value = t;
      feld.setAttribute("readonly", "");
      feld.style.position = "fixed";
      feld.style.opacity = "0";
      document.body.appendChild(feld);
      feld.select();
      let ok = false;
      try { ok = document.execCommand("copy"); } catch (e2) { ok = false; }
      document.body.removeChild(feld);
      return ok;
    }
  }

  knopf.addEventListener("click", async () => {
    const ok = await kopieren(text);
    status.textContent = ok ? (IG ? "✅ Kopiert – Instagram öffnet sich …" : "✅ Kopiert – Facebook öffnet sich …")
                            : "⚠️ Kopieren ging nicht – Text unten lange drücken und kopieren.";
    // Nackter Post: Facebook ohne angehängten Artikel öffnen (am Handy direkt die App)
    const ua = navigator.userAgent;
    const app = IG ? { paket: "com.instagram.android", web: "https://www.instagram.com/", ios: "instagram://app" }
                   : { paket: "com.facebook.katana", web: "https://m.facebook.com/", ios: "fb://feed" };
    let ziel = IG ? app.web : "https://www.facebook.com/";
    if (/Android/i.test(ua)) {
      ziel = "intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;" +
             "package=" + app.paket + ";S.browser_fallback_url=" + encodeURIComponent(app.web) + ";end";
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      ziel = app.ios;
      setTimeout(() => { location.href = app.web; }, 1800);
    }
    setTimeout(() => { location.href = ziel; }, ok ? 400 : 2500);
  });

  const IG = new URLSearchParams(location.hash.slice(1)).get("ziel") === "ig";
  if (IG) {
    document.title = "Auf Instagram posten";
    document.querySelector("h1").textContent = "📸 Auf Instagram posten";
    document.querySelector("main p").innerHTML = "Bild vorher in Telegram speichern (⋮ → In Galerie speichern). " +
      "Dann den Knopf drücken: Text wird kopiert und Instagram öffnet sich. Dort <b>＋</b> → Bild wählen → " +
      "<b>Einfügen</b> → <b>Teilen</b>.";
    knopf.textContent = "📋 Kopieren & Instagram öffnen";
    knopf.style.background = "linear-gradient(90deg,#f58529,#dd2a7b,#8134af)";
  }

  lesen().then(() => {
    vorschau.textContent = text || "Kein Text gefunden.";
    knopf.disabled = !text;
  }).catch(() => {
    vorschau.textContent = "Der Text konnte nicht geladen werden.";
  });
</script>
</body>
</html>
